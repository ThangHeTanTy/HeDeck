name: hedeck
description: HeDeck — bảng điều khiển kiểu Steam Deck, mở và focus ứng dụng trên thiết bị Windows.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <5.0.0'

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.3.2
  # Ghim phần Android ở nhánh 2.4.x. Từ 2.5.0 (10/2026) plugin tra lớp Kotlin
  # theo tên qua JNI; 2.5.0 và 2.5.1 quên quy tắc R8 nên bản release chết ngay
  # lúc mở app với NoSuchMethodError ...SharedPreferencesApiRegistrar.getAll.
  # 2.4.x dùng kênh tin nhắn Pigeon, đã chạy ổn. Nới ra khi nhánh 2.5 ổn định.
  shared_preferences_android: ">=2.4.27 <2.5.0"
  cryptography: ^2.7.0
  provider: ^6.1.2
  multicast_dns: ^0.3.2+7

dev_dependencies:
  flutter_lints: '>=4.0.0'
  flutter_launcher_icons: '>=0.13.0'

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# Sinh icon launcher cho Android: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0F1218"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 24
